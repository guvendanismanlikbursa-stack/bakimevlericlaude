; 30 Temmuz 2026: sunucunun varsayilan PHP ayari (upload_max_filesize=2M)
; uygulamanin kendi izin verdigi 5MB'lik gorsel yuklemesinden kucuktu -
; gercek telefon fotograflari (genelde 3-8MB) PHP tarafindan Laravel'e
; hic ulasmadan sessizce reddediliyordu, hicbir log kaydi birakmadan.
; Bu dosya .htaccess'teki php_value gibi mod_php'ye bagimli degil, PHP'nin
; kendisi tarafindan okunur - FastCGI/PHP-FPM dahil bu paylasimli hostingin
; hangi calisma modunu kullandigindan bagimsiz calisir, yanlis yorumlanirsa
; bile (bazi ayarlar desteklenmezse) sessizce yok sayilir - .htaccess'teki
; gibi tum siteyi 500'e dusurme riski tasimaz.
upload_max_filesize = 10M
post_max_size = 60M
max_file_uploads = 20

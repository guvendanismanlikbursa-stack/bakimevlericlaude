name: Testler

# 13 Agustos 2026: kullanicinin acik talebi uzerine, testler/boot-check/
# deploy-script-testleri (asagidaki 3 job) GECERSE master'a yapilan HER
# push otomatik olarak canliya cikar (bkz. en alttaki "deploy" job'u).
# Deploy adimi deploy/deploy.py'nin KENDISINI cagirir - yani zaten var olan
# TUM guvenlik katmanlari (yerel test tekrari, --no-dev autoload sizinti
# kontrolu, bootstrap dumani, deploy sonrasi /_saglik kontrolu) otomatik
# akiste de aynen gecerlidir. deploy job'u FTP_HOST/FTP_USER/FTP_PASS/
# OPS_SECRET/DOC_ROOTS/DOMAINS GitHub Secrets'lari TANIMLI DEGILSE guvenli
# sekilde BASARISIZ olur (production'a HICBIR SEY yazilmadan) - bu yuzden
# secrets eklenene kadar bu is kirmizi gorunur ama zararsizdir.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP kurulumu
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, zip
          coverage: none

      - name: .env hazirla (composer'in package:discover kancasi .env'e ihtiyac duyuyor)
        run: cp .env.example .env

      - name: Composer bagimliliklarini kur
        run: composer install --no-interaction --prefer-dist

      - name: APP_KEY uret
        run: php artisan key:generate

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend derle (public/build .gitignore'da, testler @vite icin gerektiriyor)
        run: npm ci && npm run build

      - name: Testleri calistir
        run: vendor/bin/phpunit

  production-boot-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP kurulumu
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, zip
          coverage: none

      - name: .env hazirla (composer'in package:discover kancasi .env'e ihtiyac duyuyor)
        run: cp .env.example .env

      - name: SADECE production bagimliliklarini kur (--no-dev, production'daki ayni durum)
        run: composer install --no-interaction --prefer-dist --no-dev

      - name: APP_KEY uret (DB'ye dokunmadan)
        run: php artisan key:generate --force

      - name: Bootstrap dumani - autoload/service-provider hatalarini yakalar
        run: |
          php artisan route:list --no-ansi > /dev/null
          php -r '
            require "vendor/autoload.php";
            require "bootstrap/app.php";
            echo "AUTOLOAD_VE_BOOTSTRAP_OK" . PHP_EOL;
          '

      - name: dev-only paket sizintisi kontrolu (myclabs/deep-copy sinifi hatalar)
        run: |
          php -r '
            $composerJson = json_decode(file_get_contents("composer.json"), true);
            $devPackages = array_keys($composerJson["require-dev"] ?? []);
            $leaked = [];
            foreach (["vendor/composer/autoload_classmap.php", "vendor/composer/autoload_static.php", "vendor/composer/autoload_real.php", "vendor/composer/autoload_files.php"] as $file) {
                if (!file_exists($file)) continue;
                $content = file_get_contents($file);
                foreach ($devPackages as $pkg) {
                    $fragment = explode("/", $pkg)[1];
                    if (str_contains($content, $fragment)) { $leaked[] = "$pkg -> $file"; }
                }
            }
            if ($leaked) {
                fwrite(STDERR, "DEV-ONLY PAKET SIZINTISI:\n" . implode("\n", $leaked) . "\n");
                exit(1);
            }
            echo "Sizinti yok.\n";
          '

  deploy-script-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Git kullanici bilgisi (VersionBumpDetectionTest gecici commit'ler atiyor)
        run: |
          git config --global user.email "ci@test.local"
          git config --global user.name "CI"

      - name: deploy.py birim testlerini calistir
        run: cd deploy && python3 -m unittest test_deploy -v

  deploy:
    needs: [test, production-boot-check, deploy-script-tests]
    # Sadece master'a GERCEK push'ta (PR'da asla) calisir - fork/PR'lardan
    # gelen kod hic bir zaman secrets'a erisemez, bu GitHub'in kendi guvenlik
    # kurali, ayrica burada da acikca belirtiliyor.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # deploy.py basarili olursa deploy/.last_deployed_sha guncellenir ve
    # geri commit+push edilir (bkz. son adim) - repoya yazma izni gerekir.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PHP kurulumu
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, zip
          coverage: none

      - name: .env hazirla
        run: cp .env.example .env

      - name: Composer bagimliliklarini kur (dev dahil - deploy.py --no-dev'i kendi ureteceginden)
        run: composer install --no-interaction --prefer-dist

      - name: APP_KEY uret
        run: php artisan key:generate

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend derle (deploy.py public/build'i sunucuya senkronize eder)
        run: npm ci && npm run build

      - name: composer.phar indir (yerel deploy.py ile ayni arac, repo'da tutulmuyor)
        run: curl -sS https://getcomposer.org/installer | php

      - name: deploy/.env.deploy dosyasini GitHub Secrets'tan olustur
        run: |
          cat > deploy/.env.deploy <<EOF
          FTP_HOST=${{ secrets.DEPLOY_FTP_HOST }}
          FTP_USER=${{ secrets.DEPLOY_FTP_USER }}
          FTP_PASS=${{ secrets.DEPLOY_FTP_PASS }}
          OPS_SECRET=${{ secrets.DEPLOY_OPS_SECRET }}
          DOC_ROOTS=${{ secrets.DEPLOY_DOC_ROOTS }}
          DOMAINS=${{ secrets.DEPLOY_DOMAINS }}
          EOF

      - name: Git kullanici bilgisi (deploy.py commit atmiyor ama guvence icin)
        run: |
          git config --global user.email "deploy-bot@bakimevleri.com"
          git config --global user.name "Otomatik Deploy"

      - name: deploy.py calistir (testler + autoload guvenlik + FTP yukleme + migrate/cache-refresh + /_saglik kontrolu)
        run: python deploy/deploy.py

      - name: deploy/.last_deployed_sha guncellemesini geri gonder
        run: |
          if ! git diff --quiet -- deploy/.last_deployed_sha; then
            git add deploy/.last_deployed_sha
            git commit -m "deploy/.last_deployed_sha guncelle [otomatik]"
            git push
          fi
